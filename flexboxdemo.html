<!doctype html>

<html lang="en">

<head>

    <title>flexbox demo</title>

            border: 2px solid #8d2a2a;
            border-radius: 10px;
            /*flex-grow: 1;*/
        }

        #two {

            border-radius: 20px;
            margin-bottom: 50px;
            padding: 10px;

            flex-direction: column;

        }

            background-color: #c8c577;

            text-align: center;
            background-color: #50a9e8;
            border: 2px solid #00ccff;
            border-radius: 10px;
            /*flex-grow: 1;*/
        }
        #four {
            background-color: #f5558d;
            border: 2px solid #ff0084;
            border-radius: 20px;
            margin-bottom: 50px;
            padding: 10px;
            display: flex;
            /*flex-direction: row;*/

        }
        #four div {

            background-color: #ff61e5;
            border: 2px solid #ff0000;
            border-radius: 10px;
            flex-grow: 1;
